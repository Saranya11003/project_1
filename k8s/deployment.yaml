apiVersion: apps/v1
kind: Deployment
metadata:
  name: posecloud-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: posecloud
  template:
    metadata:
      labels:
        app: posecloud
    spec:
      containers:
        - name: posecloud
          image: your-dockerhub-username/posecloud-app:latest
          ports:
            - containerPort: 8000
          env:
            - name: MODEL_CHOICE
              value: "model1"
